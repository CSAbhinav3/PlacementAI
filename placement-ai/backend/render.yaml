# Render Blueprint for the PlacementAI backend.
#
# Deploy: on render.com, "New +" -> "Blueprint", point it at this repo.
# Render finds this file via its path (backend/render.yaml) once you set
# the blueprint's root to the `placement-ai` directory - see DEPLOY.md at
# the repo root for the full walkthrough, including the frontend side and
# the CORS_ORIGINS chicken-and-egg (backend needs the frontend's URL,
# which doesn't exist until the frontend is deployed once).
#
# GROQ_API_KEY is marked sync:false, meaning Render will prompt for it in
# the dashboard instead of reading a value from this file - never put a
# real key in this file, it's committed to the repo.

services:
  - type: web
    name: placementai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173
      # Optional - only needed if you attach a persistent disk (paid
      # plans only) so chat history survives redeploys/restarts. Without
      # this, chat.db lives in the container's ephemeral filesystem and
      # resets on every deploy - fine for a demo, not for real use.
      # - key: DB_DIR
      #   value: /var/data

    # Uncomment together with DB_DIR above to persist chat history.
    # disk:
    #   name: chat-data
    #   mountPath: /var/data
    #   sizeGB: 1
